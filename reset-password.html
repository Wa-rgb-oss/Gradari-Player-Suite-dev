<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradari Mireris Password Recovery</title>
<style>
:root{--bg:#0b0d0f;--panel:#121519;--text:#e8e3d8;--muted:#9b9b96;--line:#30343a;--gold:#a9782b;--gold2:#d1a657}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}header{padding:28px 5vw 20px;border-bottom:1px solid var(--line);background:#0e1114}header h1{margin:0;color:var(--gold2);letter-spacing:.08em;font-size:clamp(25px,4vw,42px)}header p,.state{color:var(--muted)}main{max-width:620px;margin:auto;padding:30px 5vw}.card{background:var(--panel);border:1px solid var(--line);padding:22px}h2{color:var(--gold2)}label{display:block;margin:14px 0 6px;color:#d9c69d}input{width:100%;background:#0c0f12;color:var(--text);border:1px solid #3a3e44;padding:11px;font:inherit}button{background:var(--gold);border:1px solid var(--gold2);color:#0a0a0a;padding:10px 14px;cursor:pointer;font:inherit;font-weight:bold}.state{margin-top:14px;line-height:1.5}.hidden{display:none}
</style></head><body>
<header><h1>GRADARI MIRERIS</h1><p>GAME MASTER ADMINISTRATION // Credential Recovery</p></header>
<main><section class="card"><h2>RESET GM PASSWORD</h2><p id="intro">Verifying the recovery authorization...</p><form id="resetForm" class="hidden"><label>New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm New Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><div style="margin-top:18px"><button type="submit">UPDATE PASSWORD</button></div></form><div id="state" class="state"></div></section></main>
<script>
const SUPABASE_URL='https://tgszdvvitdijzkkbrlpl.supabase.co';
const SUPABASE_KEY='sb_publishable_6GE5AFuO7AH1Ym7GU5qjoA_iUAoFAI2';
const params=new URLSearchParams(location.hash.slice(1));
const accessToken=params.get('access_token');
const type=params.get('type');
const state=document.getElementById('state'),form=document.getElementById('resetForm'),intro=document.getElementById('intro');
if(accessToken && (!type || type==='recovery')){intro.textContent='Recovery authorization accepted. Enter your new Game Master password.';form.classList.remove('hidden')}else{intro.textContent='This page needs a valid Supabase password recovery link.';state.textContent='Return to admin.html and request a new recovery email.'}
form.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){state.textContent='Passwords do not match.';return}state.textContent='Updating password...';try{const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const body=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+(body?' • '+body:''));state.textContent='Password updated. Redirecting to GM Administration...';location.hash='';setTimeout(()=>location.href='admin.html',1200)}catch(err){state.textContent='Password update failed: '+err.message}});
</script></body></html>
