<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=0.9,minimum-scale=0.75,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#050a0e">
  <meta name="robots" content="noindex,nofollow">
  <title>Password Recovery | Gradari Mireris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-layout" style="grid-template-columns:minmax(320px,.85fr) minmax(420px,1.15fr)">
    <section class="auth-visual">
      <div class="auth-wordmark">
        <div class="system-label">GRADARI MIRERIS // GM SECURITY</div>
        <h1>ACCESS<span>RECOVERY</span></h1>
      </div>
      <div class="auth-visual-copy">
        <p>Credential recovery for the restricted Game Master administration interface.</p>
        <div class="telemetry">RECOVERY NODE // AUTHORIZATION TOKEN REQUIRED</div>
      </div>
    </section>

    <section class="auth-terminal">
      <div class="auth-card">
        <div class="hud-kicker amber">GM CREDENTIAL RECOVERY</div>
        <h2>Reset Password</h2>
        <p id="intro">VERIFYING RECOVERY AUTHORIZATION...</p>

        <form id="resetForm" class="form-shell" hidden>
          <label><span>New Password</span><input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
          <label><span>Confirm New Password</span><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
          <button class="hud-button amber" type="submit">UPDATE PASSWORD</button>
        </form>
        <div class="auth-status" id="state" role="status"></div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const accessToken = params.get("access_token");
    const type = params.get("type");
    const state = document.getElementById("state");
    const form = document.getElementById("resetForm");
    const intro = document.getElementById("intro");

    if (accessToken && (!type || type === "recovery")) {
      intro.textContent = "RECOVERY AUTHORIZATION ACCEPTED. ENTER A NEW GAME MASTER PASSWORD.";
      form.hidden = false;
    } else {
      intro.textContent = "VALID RECOVERY AUTHORIZATION REQUIRED.";
      state.classList.add("error");
      state.textContent = "RETURN TO GM ADMINISTRATION AND REQUEST A NEW RECOVERY EMAIL.";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        state.className = "auth-status error";
        state.textContent = "PASSWORDS DO NOT MATCH.";
        return;
      }

      state.className = "auth-status";
      state.textContent = "UPDATING PASSWORD...";

      try {
        const response = await fetch(GMAuth.CONFIG.url + "/auth/v1/user", {
          method:"PUT",
          headers:{
            apikey:GMAuth.CONFIG.key,
            Authorization:"Bearer " + accessToken,
            "Content-Type":"application/json"
          },
          body:JSON.stringify({ password })
        });

        const body = await response.text();
        if (!response.ok) throw new Error(body || "HTTP " + response.status);

        state.className = "auth-status success";
        state.textContent = "PASSWORD UPDATED // RETURNING TO GM ADMINISTRATION";
        location.hash = "";
        setTimeout(() => location.href = "admin.html", 900);
      } catch (error) {
        state.className = "auth-status error";
        state.textContent = "PASSWORD UPDATE FAILED // " + error.message;
      }
    });
  </script>
</body>
</html>
