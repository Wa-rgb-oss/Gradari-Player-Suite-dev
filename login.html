<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Login | Gradari Mireris</title>
<style>
:root{--bg:#0b0d0f;--panel:#121519;--text:#e8e3d8;--muted:#9b9b96;--line:#30343a;--gold:#a9782b;--gold2:#d1a657}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
header{padding:28px 5vw 20px;border-bottom:1px solid var(--line);background:#0e1114;position:relative}
header h1{margin:0;color:var(--gold2);letter-spacing:.08em;font-size:clamp(25px,4vw,42px)}
header p{color:var(--muted);margin:8px 0 0}.home{position:absolute;right:5vw;top:28px;color:var(--gold2);text-decoration:none;border:1px solid var(--gold);padding:9px 14px}
main{max-width:560px;margin:55px auto;padding:0 20px}.card{background:var(--panel);border:1px solid var(--line);padding:26px}
h2{color:var(--gold2);margin-top:0}label{display:block;margin:16px 0 6px;color:#d9c69d}
input{width:100%;background:#0c0f12;color:var(--text);border:1px solid #3a3e44;padding:11px;font:inherit}
button{width:100%;margin-top:20px;background:var(--gold);border:1px solid var(--gold2);color:#0a0a0a;padding:11px;font:inherit;font-weight:bold;cursor:pointer}
.switch{margin-top:18px;text-align:center;color:var(--muted)}.switch a{color:var(--gold2);cursor:pointer}.state{margin-top:16px;color:var(--muted);line-height:1.4}
.hidden{display:none}
@media(max-width:650px){.home{right:16px;top:18px}}
</style>
</head>
<body>
<header><h1>GRADARI MIRERIS</h1><a class="home" href="index.html">RETURN HOME</a><p>PLAYER ACCESS // Identity precedes authority.</p></header>
<main>
<div class="card">
<section id="loginView">
<h2>PLAYER LOGIN</h2>
<form id="loginForm">
<label>Email</label><input name="email" type="email" autocomplete="email" required>
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<button type="submit">LOGIN</button>
<div class="state"></div>
</form>
<div class="switch">No account yet? <a id="showSignup">Create Account</a></div>
</section>

<section id="signupView" class="hidden">
<h2>CREATE PLAYER ACCOUNT</h2>
<form id="signupForm">
<label>Email</label><input name="email" type="email" autocomplete="email" required>
<label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required>
<label>Confirm Password</label><input name="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">CREATE ACCOUNT</button>
<div class="state"></div>
</form>
<div class="switch">Already registered? <a id="showLogin">Return to Login</a></div>
</section>
</div>
</main>
<script>
const SUPABASE_URL="https://tgszdvvitdijzkkbrlpl.supabase.co";
const SUPABASE_KEY="sb_publishable_6GE5AFuO7AH1Ym7GU5qjoA_iUAoFAI2";

const loginView=document.getElementById('loginView'),signupView=document.getElementById('signupView');
document.getElementById('showSignup').onclick=()=>{loginView.classList.add('hidden');signupView.classList.remove('hidden')};
document.getElementById('showLogin').onclick=()=>{signupView.classList.add('hidden');loginView.classList.remove('hidden')};

async function authRequest(path,body){
 const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const data=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.msg||data.message||data.error_description||data.error||('HTTP '+r.status));
 return data;
}
function saveSession(data){
 if(data.access_token&&data.refresh_token){
  localStorage.setItem('gm_access_token',data.access_token);
  localStorage.setItem('gm_refresh_token',data.refresh_token);
  if(data.user) localStorage.setItem('gm_auth_user',JSON.stringify(data.user));
 }
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const f=e.currentTarget,s=f.querySelector('.state');s.textContent='Signing in...';
 try{
  const d=Object.fromEntries(new FormData(f));
  const data=await authRequest('/auth/v1/token?grant_type=password',{email:d.email,password:d.password});
  saveSession(data);s.textContent='Login successful. Opening your dashboard...';
  setTimeout(()=>location.href='dashboard.html',500);
 }catch(err){s.textContent='Login failed: '+err.message}
});
document.getElementById('signupForm').addEventListener('submit',async e=>{
 e.preventDefault();const f=e.currentTarget,s=f.querySelector('.state'),d=Object.fromEntries(new FormData(f));
 if(d.password!==d.confirm){s.textContent='Passwords do not match.';return}
 s.textContent='Creating account...';
 try{
  const data=await authRequest('/auth/v1/signup?redirect_to='+encodeURIComponent('https://wa-rgb-oss.github.io/Gradari-Player-Suite/login.html'),{email:d.email,password:d.password});
  saveSession(data);
  if(data.access_token){s.textContent='Account created. Opening your dashboard...';setTimeout(()=>location.href='dashboard.html',500)}
  else{s.textContent='Account created. Check your email to confirm your account, then return here to log in.'}
 }catch(err){s.textContent='Account creation failed: '+err.message}
});
</script>
</body></html>
