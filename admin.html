<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050a0e">
  <meta name="robots" content="noindex,nofollow">
  <title>GM Administration | Gradari Mireris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-content" style="max-width:1320px">
    <section class="hud-panel compact" style="margin-bottom:18px">
      <div class="section-head">
        <div><div class="section-code">RESTRICTED / GAME MASTER</div><h2>GM Administration</h2></div>
        <a class="hud-button secondary" href="dashboard.html">RETURN TO PLAYER INTERFACE</a>
      </div>
      <p class="hero-copy" style="margin:0">Restricted action record review and resolution interface.</p>
    </section>

    <section id="adminLogin" class="hud-panel" style="max-width:620px;margin:40px auto">
      <div class="hud-kicker amber">GM AUTHENTICATION</div>
      <h2 style="margin:0 0 10px;text-transform:uppercase">Restricted Access</h2>
      <p class="hero-copy" style="margin:0 0 24px">Sign in with the authorized Game Master account.</p>
      <form id="loginForm" class="form-shell">
        <label><span>Email</span><input id="email" type="email" autocomplete="username" required></label>
        <label><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
        <div class="form-actions">
          <button class="hud-button amber" type="submit">SIGN IN</button>
          <button class="hud-button secondary" id="forgotPassword" type="button">RESET PASSWORD</button>
        </div>
        <div class="form-state" id="loginState" role="status"></div>
      </form>
    </section>

    <section id="adminDashboard" hidden>
      <div class="hud-panel compact" style="margin-bottom:18px">
        <div class="form-actions">
          <button class="hud-button" id="refresh" type="button">REFRESH RECORDS</button>
          <select id="statusFilter" style="width:auto;min-width:180px">
            <option value="">ALL STATUS</option>
            <option>Pending</option><option>Reviewing</option><option>Resolved</option><option>Rejected</option>
          </select>
          <button class="hud-button secondary" id="adminLogout" type="button">SIGN OUT GM</button>
        </div>
        <div class="form-state" id="dashState"></div>
      </div>
      <div id="records" class="stack"></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    const TOKEN_KEY = "gm_admin_access_token";
    const REFRESH_KEY = "gm_admin_refresh_token";
    let accessToken = sessionStorage.getItem(TOKEN_KEY);
    let allRows = [];

    async function authApi(path, options = {}) {
      const headers = {
        apikey: GMAuth.CONFIG.key,
        "Content-Type":"application/json",
        ...(options.headers || {})
      };
      if (accessToken) headers.Authorization = "Bearer " + accessToken;
      const response = await fetch(GMAuth.CONFIG.url + path, { ...options, headers });
      const text = await response.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!response.ok) throw new Error(typeof data === "string" ? data : (data?.message || data?.msg || "HTTP " + response.status));
      return data;
    }

    async function signIn(email, password) {
      return authApi("/auth/v1/token?grant_type=password", {
        method:"POST",
        body:JSON.stringify({ email, password })
      });
    }

    function showDashboard() {
      document.getElementById("adminLogin").hidden = true;
      document.getElementById("adminDashboard").hidden = false;
    }

    function showLogin() {
      document.getElementById("adminDashboard").hidden = true;
      document.getElementById("adminLogin").hidden = false;
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const state = document.getElementById("loginState");
      state.textContent = "AUTHENTICATING GM ACCOUNT...";
      try {
        const data = await signIn(document.getElementById("email").value.trim(), document.getElementById("password").value);
        accessToken = data.access_token;
        sessionStorage.setItem(TOKEN_KEY, data.access_token);
        if (data.refresh_token) sessionStorage.setItem(REFRESH_KEY, data.refresh_token);
        showDashboard();
        state.textContent = "";
        await loadRows();
      } catch (error) {
        state.textContent = "GM AUTHENTICATION FAILED // " + error.message;
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", async () => {
      const state = document.getElementById("loginState");
      const address = document.getElementById("email").value.trim();
      if (!address) {
        state.textContent = "ENTER THE GM EMAIL ADDRESS FIRST.";
        return;
      }
      const redirectTo = new URL("reset-password.html", location.href).href;
      try {
        state.textContent = "SENDING RECOVERY LINK...";
        await authApi("/auth/v1/recover?redirect_to=" + encodeURIComponent(redirectTo), {
          method:"POST",
          body:JSON.stringify({ email: address })
        });
        state.textContent = "RECOVERY EMAIL SENT.";
      } catch (error) {
        state.textContent = "RECOVERY FAILED // " + error.message;
      }
    });

    async function loadRows() {
      const state = document.getElementById("dashState");
      state.textContent = "LOADING ACTION RECORDS...";
      try {
        allRows = await authApi("/rest/v1/actions_tab?select=*&order=created_at.desc");
        renderRows();
        state.textContent = allRows.length + " ACTION RECORD(S) LOADED";
      } catch (error) {
        state.textContent = "RECORD LOAD FAILED // " + error.message;
      }
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    }

    function renderRows() {
      const filter = document.getElementById("statusFilter").value;
      const rows = allRows.filter(row => !filter || (row.status || "Pending") === filter);
      const root = document.getElementById("records");

      root.innerHTML = rows.map(row => `
        <article class="hud-panel compact">
          <div class="section-head">
            <div>
              <div class="section-code">${row.secret ? "CLASSIFIED ACTION" : "ACTION RECORD"} // ${esc(row.category || "UNCATEGORIZED")}</div>
              <h2>${esc(row.action_title || "Untitled Action")}</h2>
            </div>
            <p>${esc(row.created_at ? new Date(row.created_at).toLocaleString() : "NO TIMESTAMP")}</p>
          </div>
          <div class="form-grid">
            <div class="notice"><strong>PLAYER / FACTION</strong><br>${esc(row.player || "Not specified")}</div>
            <label><span>Status</span>
              <select class="record-status" data-id="${esc(row.id)}">
                <option ${(!row.status || row.status === "Pending") ? "selected" : ""}>Pending</option>
                <option ${row.status === "Reviewing" ? "selected" : ""}>Reviewing</option>
                <option ${row.status === "Resolved" ? "selected" : ""}>Resolved</option>
                <option ${row.status === "Rejected" ? "selected" : ""}>Rejected</option>
              </select>
            </label>
          </div>
          <div class="form-grid" style="margin-top:14px">
            <div class="notice"><strong>OBJECTIVE</strong><br>${esc(row.objective || "Not specified")}</div>
            <div class="notice"><strong>TARGET / LOCATION</strong><br>${esc(row.target || "Not specified")}</div>
          </div>
          <div class="notice" style="margin-top:14px"><strong>METHOD</strong><br>${esc(row.method || "Not specified")}</div>
          <div class="notice" style="margin-top:14px"><strong>COMMITMENTS</strong><br>${esc(row.commitments || "Not specified")}</div>
          <div class="notice" style="margin-top:14px"><strong>INTENT</strong><br>${esc(row.intent || "Not specified")}</div>
          ${row.secret ? '<div class="notice" style="margin-top:14px"><strong>PUBLIC COVER STORY</strong><br>' + esc(row.cover_story || "Not specified") + '</div>' : ""}
          ${row.orders ? '<div class="notice" style="margin-top:14px"><strong>ORDERS</strong><br>' + esc(row.orders) + '</div>' : ""}
          ${row.notes ? '<div class="notice" style="margin-top:14px"><strong>NOTES</strong><br>' + esc(row.notes) + '</div>' : ""}
        </article>`).join("") || '<div class="notice">NO MATCHING ACTION RECORDS.</div>';

      document.querySelectorAll(".record-status").forEach(select => {
        select.addEventListener("change", () => updateStatus(select.dataset.id, select.value));
      });
    }

    async function updateStatus(id, status) {
      const state = document.getElementById("dashState");
      try {
        await authApi("/rest/v1/actions_tab?id=eq." + encodeURIComponent(id), {
          method:"PATCH",
          headers:{ Prefer:"return=minimal" },
          body:JSON.stringify({ status })
        });
        const row = allRows.find(x => String(x.id) === String(id));
        if (row) row.status = status;
        state.textContent = "ACTION " + id + " UPDATED TO " + status.toUpperCase();
      } catch (error) {
        state.textContent = "STATUS UPDATE FAILED // " + error.message;
      }
    }

    document.getElementById("refresh").addEventListener("click", loadRows);
    document.getElementById("statusFilter").addEventListener("change", renderRows);
    document.getElementById("adminLogout").addEventListener("click", () => {
      accessToken = null;
      sessionStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(REFRESH_KEY);
      showLogin();
    });

    if (accessToken) {
      showDashboard();
      loadRows();
    }
  </script>
</body>
</html>
