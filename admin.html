<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradari Mireris GM Administration</title>
<style>
:root{--bg:#0b0d0f;--panel:#121519;--panel2:#171b20;--text:#e8e3d8;--muted:#9b9b96;--line:#30343a;--gold:#a9782b;--gold2:#d1a657;--red:#7d302c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}header{padding:28px 5vw 20px;border-bottom:1px solid var(--line);background:#0e1114}header h1{margin:0;color:var(--gold2);letter-spacing:.08em;font-size:clamp(25px,4vw,42px)}header p,.muted{color:var(--muted)}main{max-width:1200px;margin:auto;padding:30px 5vw 60px}.card{background:var(--panel);border:1px solid var(--line);padding:22px;margin-bottom:18px}h2,h3{color:var(--gold2)}label{display:block;margin:14px 0 6px;color:#d9c69d}input,select,textarea{width:100%;background:#0c0f12;color:var(--text);border:1px solid #3a3e44;padding:11px;font:inherit}button{background:#20242a;color:var(--text);border:1px solid #454a52;padding:10px 14px;cursor:pointer;font:inherit}.primary{background:var(--gold);border-color:var(--gold2);color:#0a0a0a;font-weight:bold}.danger{border-color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar select{width:auto;min-width:160px}.state{margin-top:12px;color:var(--muted)}.action{border-left:3px solid var(--gold);padding:18px;background:#0f1215;margin:14px 0}.action.secret{border-left-color:var(--red)}.meta{color:var(--muted);font-size:.9rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field{background:#0b0d0f;border:1px solid var(--line);padding:12px;white-space:pre-wrap}.field strong{display:block;color:#d9c69d;margin-bottom:5px}.hidden{display:none}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}main{padding:18px 14px}.toolbar select,.toolbar button{width:100%}}
</style></head><body>
<div style="padding:14px 5vw 0">
  <button type="button" onclick="window.location.href='index.html'">← RETURN TO HOME</button>
</div>
<header><h1>GRADARI MIRERIS</h1><p>GAME MASTER ADMINISTRATION // Restricted Record Access</p></header>
<main>
<section id="login" class="card"><h2>GM AUTHENTICATION</h2><p class="muted">Sign in with the Game Master account configured in Supabase Authentication.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div style="margin-top:18px" class="toolbar"><button class="primary" type="submit">SIGN IN</button><button id="forgotPassword" type="button">FORGOT PASSWORD</button></div><div id="loginState" class="state"></div></form></section>
<section id="dashboard" class="hidden"><div class="card"><div class="toolbar"><button id="refresh" class="primary">REFRESH RECORDS</button><select id="statusFilter"><option value="">ALL STATUS</option><option>Pending</option><option>Reviewing</option><option>Resolved</option><option>Rejected</option></select><button id="logout">SIGN OUT</button></div><div id="dashState" class="state"></div></div><div id="records"></div></section>
</main>
<script>
const SUPABASE_URL='https://tgszdvvitdijzkkbrlpl.supabase.co';
const SUPABASE_KEY='sb_publishable_6GE5AFuO7AH1Ym7GU5qjoA_iUAoFAI2';
let accessToken=null, allRows=[];
const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
async function api(path,opts={}){const headers={...h,...(opts.headers||{})};if(accessToken)headers.Authorization='Bearer '+accessToken;const r=await fetch(SUPABASE_URL+path,{...opts,headers});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error('HTTP '+r.status+' • '+(typeof data==='string'?data:JSON.stringify(data)));return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function signIn(email,password){return api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})})}
async function sendRecovery(email){const redirectTo=location.origin+location.pathname.replace(/admin\.html$/,'reset-password.html');return api('/auth/v1/recover?redirect_to='+encodeURIComponent(redirectTo),{method:'POST',body:JSON.stringify({email})})}
document.getElementById('forgotPassword').addEventListener('click',async()=>{const s=document.getElementById('loginState');const address=document.getElementById('email').value.trim();if(!address){s.textContent='Enter your GM email first.';return}try{s.textContent='Sending recovery email...';await sendRecovery(address);s.textContent='Recovery email sent. Open the link in that email.'}catch(err){s.textContent='Recovery failed: '+err.message}});
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('loginState');s.textContent='Authenticating...';try{const d=await signIn(email.value,password.value);accessToken=d.access_token;sessionStorage.setItem('gm_access_token',accessToken);login.classList.add('hidden');dashboard.classList.remove('hidden');s.textContent='';await loadRows()}catch(err){s.textContent='Sign in failed: '+err.message}});
async function loadRows(){const s=document.getElementById('dashState');s.textContent='Loading records...';try{allRows=await api('/rest/v1/actions_tab?select=*&order=created_at.desc');render();s.textContent=allRows.length+' action record(s) loaded.'}catch(err){s.textContent='Unable to read actions: '+err.message}}
function render(){const filter=statusFilter.value;const rows=allRows.filter(r=>!filter||(r.status||'Pending')===filter);records.innerHTML=rows.map(r=>`<article class="action ${r.secret?'secret':''}"><h3>${esc(r.action_title||'Untitled Action')}</h3><div class="meta">${esc(r.player||'Unknown')} • ${esc(r.category||'Uncategorized')} • ${esc(r.created_at?new Date(r.created_at).toLocaleString():'No timestamp')}${r.secret?' • CLASSIFIED':''}</div><div class="fields"><div class="field"><strong>Target / Location</strong>${esc(r.target||'Not specified')}</div><div class="field"><strong>Status</strong><select data-id="${r.id}" class="status"><option ${(!r.status||r.status==='Pending')?'selected':''}>Pending</option><option ${r.status==='Reviewing'?'selected':''}>Reviewing</option><option ${r.status==='Resolved'?'selected':''}>Resolved</option><option ${r.status==='Rejected'?'selected':''}>Rejected</option></select></div><div class="field"><strong>Objective</strong>${esc(r.objective)}</div><div class="field"><strong>Method</strong>${esc(r.method)}</div><div class="field"><strong>Commitments</strong>${esc(r.commitments)}</div><div class="field"><strong>Intent</strong>${esc(r.intent)}</div>${r.secret?`<div class="field"><strong>Public Cover Story</strong>${esc(r.cover_story)}</div>`:''}<div class="field"><strong>Orders</strong>${esc(r.orders)}</div><div class="field"><strong>Notes</strong>${esc(r.notes)}</div></div></article>`).join('')||'<div class="card">No matching action records.</div>';document.querySelectorAll('.status').forEach(x=>x.addEventListener('change',()=>updateStatus(x.dataset.id,x.value)))}
async function updateStatus(id,status){const s=document.getElementById('dashState');try{await api('/rest/v1/actions_tab?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status})});const row=allRows.find(r=>String(r.id)===String(id));if(row)row.status=status;s.textContent='Record '+id+' updated to '+status+'.'}catch(err){s.textContent='Update failed: '+err.message}}
refresh.onclick=loadRows;statusFilter.onchange=render;logout.onclick=()=>{accessToken=null;sessionStorage.removeItem('gm_access_token');dashboard.classList.add('hidden');login.classList.remove('hidden')};
accessToken=sessionStorage.getItem('gm_access_token');if(accessToken){login.classList.add('hidden');dashboard.classList.remove('hidden');loadRows()}
</script></body></html>
